<!-- src/app/modules/auth/register/register.component.html -->
<div class="login-page">
  <div class="login-left">
    <p class="brand">LumbalgiaSG</p>
    <p class="tagline">Registra tus datos para participar en el estudio cuasi-experimental.</p>
  </div>
  <div class="login-right">
    <h2>Crear cuenta</h2>
    @if (error) { <div class="alert-error">{{ error }}</div> }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" formControlName="name" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Email institucional</label>
        <input type="email" formControlName="email" placeholder="correo@ug.edu.ec">
      </div>
      <div class="form-group">
        <label>Semestre</label>
        <input type="text" formControlName="semester" placeholder="10mo semestre">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarme' }}
      </button>
    </form>
    <a routerLink="/login" class="btn-secondary" style="display:block;text-align:center;margin-top:10px">Ya tengo cuenta</a>
  </div>
</div>
